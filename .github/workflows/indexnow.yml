# Pings /api/indexnow after every push to main, so search engines learn about
# changes the day they ship instead of at the Monday cron. The endpoint
# requires the same CRON_SECRET the Vercel crons use — add it once at
#   GitHub repo → Settings → Secrets and variables → Actions → CRON_SECRET
# Until that secret exists, this job logs a skip and exits green: a red X on
# every push over a missing nicety would train everyone to ignore red X's.
#
# The 150s sleep is deliberate slack for the Vercel build: pinging IndexNow
# with URLs the deployment hasn't served yet would submit a stale sitemap.
#
# Until 1 Oct 2026 this POST met a route that exported only GET, so the ping
# never submitted anything; the route now answers POST with the same handler.
# It sends only what changed since the last successful submission, plus the
# retired URLs in lib/redirects.mjs - see lib/indexnow.ts.
name: indexnow-on-deploy
on:
  push:
    branches: [main]
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the Vercel deploy
        run: sleep 150
      - name: Ping IndexNow
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET not set in repo secrets — skipping (the Monday cron still covers this)."
            exit 0
          fi
          code=$(curl -s -o /tmp/body -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://www.westpeakwellness.com/api/indexnow")
          echo "indexnow responded $code"
          cat /tmp/body
          [ "$code" = "200" ]
