# Tells IndexNow (Bing, and the engines that share its submissions) which
# URLs changed, after every push to main, instead of at the Monday cron.
#
# NO SECRET, SINCE 2 OCT 2026. This job used to POST /api/indexnow with
# CRON_SECRET and, with the secret never added, logged a skip and exited green
# on every push, so Bing heard nothing until Monday. The IndexNow key is
# public by protocol (it is served at /<key>.txt for the engine to check), so
# scripts/indexnow-deploy.mjs submits directly to api.indexnow.org with it.
# It reads the live sitemap, keeps the URLs whose lastmod is on or after the
# commit day, adds the retired URLs from lib/redirects.mjs, and chooses them
# with the same parseUrlset/selectUrls as the cron (lib/indexnow.ts). One POST;
# anything but 200 or 202 fails the job, so a green tick now means Bing
# accepted the list.
#
# The 150s sleep is deliberate slack for the Vercel build: submitting before
# the deployment serves the new sitemap would send yesterday's lastmods.
#
# The Monday cron (/api/indexnow, vercel.json) and the /admin button are
# unchanged; they still need CRON_SECRET on Vercel, which is a different
# place from this repo's Actions secrets.
name: indexnow-on-deploy
on:
  push:
    branches: [main]
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # lib/indexnow.ts imports lib/cron-health.ts, which imports @vercel/blob.
      - run: npm ci
      - name: Wait for the Vercel deploy
        run: sleep 150
      - name: Submit changed URLs to IndexNow
        run: node --experimental-strip-types scripts/indexnow-deploy.mjs --since "$(git log -1 --format=%cs)"
