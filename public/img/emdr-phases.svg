<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 325" width="1040" height="325" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">The eight phases of EMDR therapy</title><desc id="d">A diagram of EMDR therapy compressed into four stages: history and treatment planning, preparation and stabilisation resources, assessment through desensitisation and installation, and body scan with closure and re-evaluation.</desc>
<rect width="1040" height="325" rx="14" fill="#f7f2e8"/>
<text x="34" y="46" font-size="21" font-weight="700" fill="#2b3138">EMDR is eight phases, and most of them are not the eye movements</text><line x1="34" y1="66" x2="1006" y2="66" stroke="#e6ddce" stroke-width="1"/><rect x="34" y="96" width="228" height="189" rx="11" fill="#fffdf9" stroke="#e6ddce"/><circle cx="58" cy="122" r="13" fill="#e2edf4"/><text x="58" y="127" font-size="13" font-weight="700" fill="#3d6c92" text-anchor="middle">1</text><text x="80" y="127" font-size="15" font-weight="700" fill="#2b3138">History and planning</text><text font-size="14" fill="#545e69"><tspan x="54" y="156">Phases 1–2. Mapping what</tspan><tspan x="54" y="174.48">happened, what it still</tspan><tspan x="54" y="192.96">costs you, and which</tspan><tspan x="54" y="211.44">memory to work first.</tspan><tspan x="54" y="229.92000000000002">This part is unhurried on</tspan><tspan x="54" y="248.4">purpose.</tspan></text><path d="M267 184.5 L276 190.5 L267 196.5" fill="none" stroke="#7ba7cb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="282" y="96" width="228" height="189" rx="11" fill="#fffdf9" stroke="#e6ddce"/><circle cx="306" cy="122" r="13" fill="#e2edf4"/><text x="306" y="127" font-size="13" font-weight="700" fill="#3d6c92" text-anchor="middle">2</text><text x="328" y="127" font-size="15" font-weight="700" fill="#2b3138">Preparation</text><text font-size="14" fill="#545e69"><tspan x="302" y="156">Building the regulation</tspan><tspan x="302" y="174.48">skills you use before,</tspan><tspan x="302" y="192.96">during and after</tspan><tspan x="302" y="211.44">reprocessing. Nothing is</tspan><tspan x="302" y="229.92000000000002">targeted until you can</tspan><tspan x="302" y="248.4">come back down reliably.</tspan></text><path d="M515 184.5 L524 190.5 L515 196.5" fill="none" stroke="#7ba7cb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="530" y="96" width="228" height="189" rx="11" fill="#fffdf9" stroke="#e6ddce"/><circle cx="554" cy="122" r="13" fill="#e2edf4"/><text x="554" y="127" font-size="13" font-weight="700" fill="#3d6c92" text-anchor="middle">3</text><text x="576" y="127" font-size="15" font-weight="700" fill="#2b3138">Reprocessing</text><text font-size="14" fill="#545e69"><tspan x="550" y="156">Phases 3–5. Assessment,</tspan><tspan x="550" y="174.48">desensitisation with</tspan><tspan x="550" y="192.96">bilateral stimulation,</tspan><tspan x="550" y="211.44">and installing the belief</tspan><tspan x="550" y="229.92000000000002">you would rather hold</tspan><tspan x="550" y="248.4">instead.</tspan></text><path d="M763 184.5 L772 190.5 L763 196.5" fill="none" stroke="#7ba7cb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="778" y="96" width="228" height="189" rx="11" fill="#fffdf9" stroke="#e6ddce"/><circle cx="802" cy="122" r="13" fill="#e2edf4"/><text x="802" y="127" font-size="13" font-weight="700" fill="#3d6c92" text-anchor="middle">4</text><text x="824" y="127" font-size="15" font-weight="700" fill="#2b3138">Close and review</text><text font-size="14" fill="#545e69"><tspan x="798" y="156">Phases 6–8. A body scan,</tspan><tspan x="798" y="174.48">a deliberate close so you</tspan><tspan x="798" y="192.96">leave settled, and</tspan><tspan x="798" y="211.44">re-evaluation at the next</tspan><tspan x="798" y="229.92000000000002">session before anything</tspan><tspan x="798" y="248.4">new is opened.</tspan></text>
</svg>
