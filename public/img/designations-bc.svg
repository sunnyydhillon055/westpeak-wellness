<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 451" width="1040" height="451" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">Counselling designations in British Columbia</title><desc id="d">A comparison of regulated and unregulated counselling titles in British Columbia, showing which are held to a public complaints process and which are not.</desc>
<rect width="1040" height="451" rx="14" fill="#f7f2e8"/>
<text x="34" y="46" font-size="21" font-weight="700" fill="#2b3138">Who is actually accountable to a regulator in BC</text><line x1="34" y1="66" x2="1006" y2="66" stroke="#e6ddce"/><rect x="34" y="96" width="474" height="312" rx="11" fill="#fffdf9" stroke="#e6ddce"/><rect x="34" y="96" width="474" height="52" rx="11" fill="#e2edf4"/><rect x="34" y="136" width="474" height="12" fill="#e2edf4"/><text x="54" y="129" font-size="17" font-weight="700" fill="#3d6c92">Accountable to a body</text><circle cx="60" cy="176" r="4" fill="#7ba7cb"/><text font-size="14.5" fill="#545e69"><tspan x="76" y="181">RCC — Registered Clinical Counsellor, held by the BC</tspan><tspan x="76" y="200.14">Association of Clinical Counsellors</tspan></text><line x1="54" y1="212" x2="488" y2="212" stroke="#e6ddce"/><circle cx="60" cy="232" r="4" fill="#7ba7cb"/><text font-size="14.5" fill="#545e69"><tspan x="76" y="237">R.Psych — Registered Psychologist, regulated by the</tspan><tspan x="76" y="256.14">College of Health and Care Professionals of BC</tspan></text><line x1="54" y1="268" x2="488" y2="268" stroke="#e6ddce"/><circle cx="60" cy="288" r="4" fill="#7ba7cb"/><text font-size="14.5" fill="#545e69"><tspan x="76" y="293">RSW / RCSW — Registered Social Worker, regulated by</tspan><tspan x="76" y="312.14">the BC College of Social Workers</tspan></text><line x1="54" y1="324" x2="488" y2="324" stroke="#e6ddce"/><circle cx="60" cy="344" r="4" fill="#7ba7cb"/><text font-size="14.5" fill="#545e69"><tspan x="76" y="349">RP / CCC — Registered Psychotherapist and Canadian</tspan><tspan x="76" y="368.14">Certified Counsellor, held by their certifying bodies</tspan></text><rect x="532" y="96" width="474" height="312" rx="11" fill="#fffdf9" stroke="#e6ddce"/><rect x="532" y="96" width="474" height="52" rx="11" fill="#f7f2e8"/><rect x="532" y="136" width="474" height="12" fill="#f7f2e8"/><text x="552" y="129" font-size="17" font-weight="700" fill="#3d6c92">Anyone may use these</text><circle cx="558" cy="176" r="4" fill="#7ba7cb"/><text font-size="14.5" fill="#545e69"><tspan x="574" y="181">"Counsellor" on its own is not a protected title in BC</tspan><tspan x="574" y="200.14">today</tspan></text><line x1="552" y1="212" x2="986" y2="212" stroke="#e6ddce"/><circle cx="558" cy="232" r="4" fill="#7ba7cb"/><text font-size="14.5" fill="#545e69"><tspan x="574" y="237">"Therapist", "life coach" and "psychotherapist" carry</tspan><tspan x="574" y="256.14">no entry requirement</tspan></text><line x1="552" y1="268" x2="986" y2="268" stroke="#e6ddce"/><circle cx="558" cy="288" r="4" fill="#7ba7cb"/><text font-size="14.5" fill="#545e69"><tspan x="574" y="293">No mandatory education, supervised hours, insurance or</tspan><tspan x="574" y="312.14">complaints route</tspan></text><line x1="552" y1="324" x2="986" y2="324" stroke="#e6ddce"/><circle cx="558" cy="344" r="4" fill="#7ba7cb"/><text font-size="14.5" fill="#545e69"><tspan x="574" y="349">This changes when counselling therapy comes under the</tspan><tspan x="574" y="368.14">College of Health and Care Professionals of BC</tspan></text><text font-size="13" fill="#5f6872"><tspan x="34" y="426">Whatever the letters, you can verify a registration directly with the listed body before you book — and you should.</tspan></text>
</svg>
