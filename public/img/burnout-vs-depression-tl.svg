<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 474" width="1040" height="474" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">Pagkaubos kumpara sa depresyon</title><desc id="d">Dalawang magkapatong na bilog. Ang pagkaubos ay nakatali sa isang bahagi ng buhay at madalas gumagaan sa mahabang pahinga; ang depresyon ay nasa lahat ng bahagi. Magkapareho sila sa pagkapagod, putol-putol na tulog, hirap mag-concentrate at paglayo sa mga tao.</desc>
<rect width="1040" height="474" rx="14" fill="#f7f2e8"/>
<text x="34" y="46" font-size="21" font-weight="700" fill="#2b3138">Nag-o-overlap ang pagkaubos at depresyon — ang pagkakaiba ay kung saan ka nito sinusundan</text><line x1="34" y1="66" x2="1006" y2="66" stroke="#e6ddce"/><circle cx="400" cy="258" r="132" fill="#e2edf4" fill-opacity="0.85" stroke="#7ba7cb" stroke-width="1.6"/><circle cx="640" cy="258" r="132" fill="#dbe9f2" fill-opacity="0.7" stroke="#3d6c92" stroke-width="1.6"/><text x="338" y="112" font-size="16.5" font-weight="700" fill="#3d6c92" text-anchor="middle">Pagkaubos</text><text x="702" y="112" font-size="16.5" font-weight="700" fill="#3d6c92" text-anchor="middle">Depresyon</text><text x="520" y="196" font-size="12.5" font-weight="700" fill="#3d6c92" text-anchor="middle" letter-spacing="1.4">MAGKAPAREHO</text><text x="334" y="228" font-size="14" fill="#2b3138" text-anchor="middle">Nakatali sa isang bahagi ng buhay</text><text x="334" y="254" font-size="14" fill="#2b3138" text-anchor="middle">Panlalamig sa trabaho</text><text x="334" y="280" font-size="14" fill="#2b3138" text-anchor="middle">Madalas gumagaan sa</text><text x="334" y="306" font-size="14" fill="#2b3138" text-anchor="middle">tunay na mahabang pahinga</text><text x="520" y="226" font-size="13.5" fill="#545e69" text-anchor="middle">Pagkapagod</text><text x="520" y="252" font-size="13.5" fill="#545e69" text-anchor="middle">Putol-putol na tulog</text><text x="520" y="278" font-size="13.5" fill="#545e69" text-anchor="middle">Hirap mag-concentrate</text><text x="520" y="304" font-size="13.5" fill="#545e69" text-anchor="middle">Paglayo sa mga tao</text><text x="520" y="330" font-size="13.5" fill="#545e69" text-anchor="middle">Pagkayamot</text><text x="706" y="228" font-size="14" fill="#2b3138" text-anchor="middle">Nasa lahat ng bahagi ng buhay</text><text x="706" y="254" font-size="14" fill="#2b3138" text-anchor="middle">Nawawalan ng kasiyahan sa</text><text x="706" y="280" font-size="14" fill="#2b3138" text-anchor="middle">mga bagay na walang kinalaman sa trabaho</text><text x="706" y="306" font-size="14" fill="#2b3138" text-anchor="middle">Pagkakasala at kawalan ng halaga</text><text font-size="13" fill="#5f6872"><tspan x="34" y="434">Gabay lamang ito sa pag-unawa, hindi kasangkapan sa diagnosis. Ang pagkaubos ay isang penomenang pantrabaho sa ICD-11, hindi</tspan><tspan x="34" y="451">kondisyong medikal; propesyonal lamang ang makakapagsuri ng depresyon.</tspan></text>
</svg>
