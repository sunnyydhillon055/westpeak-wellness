<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 344" width="1040" height="344" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">Who a counsellor in British Columbia is accountable to</title><desc id="d">A four-step diagram of the accountability chain for a Registered Clinical Counsellor in BC: raising it in session, then the association complaints process, then the privacy commissioner for information concerns, and the incoming college regulator.</desc>
<rect width="1040" height="344" rx="14" fill="#f5f9fd"/>
<text x="34" y="46" font-size="21" font-weight="700" fill="#1f2a37">If something goes wrong, this is the chain</text><line x1="34" y1="66" x2="1006" y2="66" stroke="#e3ebf4" stroke-width="1"/><rect x="34" y="96" width="228" height="207.5" rx="11" fill="#ffffff" stroke="#e3ebf4"/><circle cx="58" cy="122" r="13" fill="#e8f0f9"/><text x="58" y="127" font-size="13" font-weight="700" fill="#3f6ca3" text-anchor="middle">1</text><text x="80" y="127" font-size="15" font-weight="700" fill="#1f2a37">Say it in session</text><text font-size="14" fill="#4a5768"><tspan x="54" y="156">The first and usually the</tspan><tspan x="54" y="174.48">fastest route. A</tspan><tspan x="54" y="192.96">counsellor who cannot</tspan><tspan x="54" y="211.44">hear that something is</tspan><tspan x="54" y="229.92000000000002">not working is not doing</tspan><tspan x="54" y="248.4">the job.</tspan></text><path d="M267 193.75 L276 199.75 L267 205.75" fill="none" stroke="#5b8bc4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="282" y="96" width="228" height="207.5" rx="11" fill="#ffffff" stroke="#e3ebf4"/><circle cx="306" cy="122" r="13" fill="#e8f0f9"/><text x="306" y="127" font-size="13" font-weight="700" fill="#3f6ca3" text-anchor="middle">2</text><text x="328" y="127" font-size="15" font-weight="700" fill="#1f2a37">BCACC complaints</text><text font-size="14" fill="#4a5768"><tspan x="302" y="156">The BC Association of</tspan><tspan x="302" y="174.48">Clinical Counsellors runs</tspan><tspan x="302" y="192.96">a process independent of</tspan><tspan x="302" y="211.44">any individual</tspan><tspan x="302" y="229.92000000000002">counsellor. You need</tspan><tspan x="302" y="248.4">neither their agreement</tspan><tspan x="302" y="266.88">nor their knowledge.</tspan></text><path d="M515 193.75 L524 199.75 L515 205.75" fill="none" stroke="#5b8bc4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="530" y="96" width="228" height="207.5" rx="11" fill="#ffffff" stroke="#e3ebf4"/><circle cx="554" cy="122" r="13" fill="#e8f0f9"/><text x="554" y="127" font-size="13" font-weight="700" fill="#3f6ca3" text-anchor="middle">3</text><text x="576" y="127" font-size="15" font-weight="700" fill="#1f2a37">OIPC for privacy</text><text font-size="14" fill="#4a5768"><tspan x="550" y="156">The Office of the</tspan><tspan x="550" y="174.48">Information and Privacy</tspan><tspan x="550" y="192.96">Commissioner oversees how</tspan><tspan x="550" y="211.44">private organisations</tspan><tspan x="550" y="229.92000000000002">handle your information</tspan><tspan x="550" y="248.4">under PIPA.</tspan></text><path d="M763 193.75 L772 199.75 L763 205.75" fill="none" stroke="#5b8bc4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="778" y="96" width="228" height="207.5" rx="11" fill="#ffffff" stroke="#e3ebf4"/><circle cx="802" cy="122" r="13" fill="#e8f0f9"/><text x="802" y="127" font-size="13" font-weight="700" fill="#3f6ca3" text-anchor="middle">4</text><text x="824" y="127" font-size="15" font-weight="700" fill="#1f2a37">The incoming College</text><text font-size="14" fill="#4a5768"><tspan x="798" y="156">Counselling therapy is</tspan><tspan x="798" y="174.48">moving under the College</tspan><tspan x="798" y="192.96">of Health and Care</tspan><tspan x="798" y="211.44">Professionals of BC,</tspan><tspan x="798" y="229.92000000000002">which adds a statutory</tspan><tspan x="798" y="248.4">process and a protected</tspan><tspan x="798" y="266.88">title.</tspan></text>
</svg>
