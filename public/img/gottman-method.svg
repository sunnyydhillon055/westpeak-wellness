<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 362" width="1040" height="362" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">How Gottman Method couples therapy is structured</title><desc id="d">A four-step diagram of Gottman Method couples therapy: a joint assessment session, individual sessions, a shared feedback session setting the treatment plan, and ongoing work on friendship, conflict and shared meaning.</desc>
<rect width="1040" height="362" rx="14" fill="#f7f2e8"/>
<text x="34" y="46" font-size="21" font-weight="700" fill="#2b3138">Gottman Method couples work starts with assessment, not advice</text><line x1="34" y1="66" x2="1006" y2="66" stroke="#e6ddce" stroke-width="1"/><rect x="34" y="96" width="228" height="226" rx="11" fill="#fffdf9" stroke="#e6ddce"/><circle cx="58" cy="122" r="13" fill="#e2edf4"/><text x="58" y="127" font-size="13" font-weight="700" fill="#3d6c92" text-anchor="middle">1</text><text x="80" y="127" font-size="15" font-weight="700" fill="#2b3138">Joint session</text><text font-size="14" fill="#545e69"><tspan x="54" y="156">Both partners together.</tspan><tspan x="54" y="174.48">The history of the</tspan><tspan x="54" y="192.96">relationship, what</tspan><tspan x="54" y="211.44">brought you here, and how</tspan><tspan x="54" y="229.92000000000002">the two of you handle a</tspan><tspan x="54" y="248.4">disagreement in real</tspan><tspan x="54" y="266.88">time.</tspan></text><path d="M267 203 L276 209 L267 215" fill="none" stroke="#7ba7cb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="282" y="96" width="228" height="226" rx="11" fill="#fffdf9" stroke="#e6ddce"/><circle cx="306" cy="122" r="13" fill="#e2edf4"/><text x="306" y="127" font-size="13" font-weight="700" fill="#3d6c92" text-anchor="middle">2</text><text x="328" y="127" font-size="15" font-weight="700" fill="#2b3138">Individual sessions</text><text font-size="14" fill="#545e69"><tspan x="302" y="156">Each partner separately.</tspan><tspan x="302" y="174.48">Personal history,</tspan><tspan x="302" y="192.96">individual goals, and</tspan><tspan x="302" y="211.44">anything difficult to say</tspan><tspan x="302" y="229.92000000000002">in front of the other</tspan><tspan x="302" y="248.4">person first.</tspan></text><path d="M515 203 L524 209 L515 215" fill="none" stroke="#7ba7cb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="530" y="96" width="228" height="226" rx="11" fill="#fffdf9" stroke="#e6ddce"/><circle cx="554" cy="122" r="13" fill="#e2edf4"/><text x="554" y="127" font-size="13" font-weight="700" fill="#3d6c92" text-anchor="middle">3</text><text x="576" y="127" font-size="15" font-weight="700" fill="#2b3138">Feedback session</text><text font-size="14" fill="#545e69"><tspan x="550" y="156">What the assessment found</tspan><tspan x="550" y="174.48">— strengths as well as</tspan><tspan x="550" y="192.96">problems — and an</tspan><tspan x="550" y="211.44">explicit treatment plan</tspan><tspan x="550" y="229.92000000000002">you both agree to before</tspan><tspan x="550" y="248.4">the work starts.</tspan></text><path d="M763 203 L772 209 L763 215" fill="none" stroke="#7ba7cb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="778" y="96" width="228" height="226" rx="11" fill="#fffdf9" stroke="#e6ddce"/><circle cx="802" cy="122" r="13" fill="#e2edf4"/><text x="802" y="127" font-size="13" font-weight="700" fill="#3d6c92" text-anchor="middle">4</text><text x="824" y="127" font-size="15" font-weight="700" fill="#2b3138">The work itself</text><text font-size="14" fill="#545e69"><tspan x="798" y="156">Building friendship and</tspan><tspan x="798" y="174.48">fondness, managing</tspan><tspan x="798" y="192.96">conflict rather than</tspan><tspan x="798" y="211.44">winning it, and</tspan><tspan x="798" y="229.92000000000002">rebuilding shared</tspan><tspan x="798" y="248.4">meaning. Skills are</tspan><tspan x="798" y="266.88">practised in session, not</tspan><tspan x="798" y="285.36">assigned.</tspan></text>
</svg>
