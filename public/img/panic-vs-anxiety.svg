<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" width="1040" height="430" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">Panic attack versus anxiety over time</title><desc id="d">A line chart contrasting a panic attack, which spikes to peak intensity within about ten minutes and then falls away, with generalised anxiety, which rises slowly and stays at a moderate plateau for a long period.</desc>
<rect width="1040" height="430" rx="14" fill="#f5f9fd"/>
<text x="34" y="46" font-size="21" font-weight="700" fill="#1f2a37">Panic attack vs. anxiety: the shape over time</text><line x1="34" y1="66" x2="1006" y2="66" stroke="#e3ebf4"/>
<line x1="90" y1="110" x2="90" y2="330" stroke="#e3ebf4" stroke-width="1.5"/>
<line x1="90" y1="330" x2="996" y2="330" stroke="#e3ebf4" stroke-width="1.5"/>
<text x="76" y="118" font-size="12.5" fill="#7d8896" text-anchor="end">high</text>
<text x="76" y="330" font-size="12.5" fill="#7d8896" text-anchor="end">low</text>
<text x="32" y="220" font-size="13" fill="#4a5768" transform="rotate(-90 32 220)" text-anchor="middle">intensity</text>
<text x="543" y="364" font-size="13" fill="#4a5768" text-anchor="middle">time &#8594;</text><path d="M110 310 C 230 270, 330 222, 490 214 C 650 206, 790 228, 986 218" fill="none" stroke="#5b8bc4" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/><path d="M110 324 C 136 320, 152 124, 186 120 C 222 116, 258 230, 304 306 C 340 322, 370 324, 410 324" fill="none" stroke="#3f6ca3" stroke-width="3.4" stroke-linecap="round"/><circle cx="202" cy="119" r="5" fill="#3f6ca3"/><text x="216" y="114" font-size="13.5" font-weight="700" fill="#3f6ca3">peak within about 10 minutes</text><line x1="38" y1="390" x2="78" y2="390" stroke="#3f6ca3" stroke-width="3.4" stroke-linecap="round"/><text x="88" y="395" font-size="14" fill="#1f2a37" font-weight="600">Panic attack</text><text x="194" y="395" font-size="13.5" fill="#4a5768">abrupt surge, peaks fast, subsides in well under an hour</text><line x1="594" y1="390" x2="634" y2="390" stroke="#5b8bc4" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/><text x="644" y="395" font-size="14" fill="#1f2a37" font-weight="600">Anxiety</text><text x="716" y="395" font-size="13.5" fill="#4a5768">builds gradually, can sit at a plateau for hours or days</text>
</svg>
