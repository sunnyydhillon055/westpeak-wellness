<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 451" width="1040" height="451" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">How paying for counselling with extended health works</title><desc id="d">A two-column comparison of direct billing, where the clinic bills the insurer, against pay-and-submit, where the client pays at the session, receives a receipt with the counsellor registration number, and submits it for reimbursement.</desc>
<rect width="1040" height="451" rx="14" fill="#f5f9fd"/>
<text x="34" y="46" font-size="21" font-weight="700" fill="#1f2a37">Two ways extended health plans pay — and which one applies here</text><line x1="34" y1="66" x2="1006" y2="66" stroke="#e3ebf4"/><rect x="34" y="96" width="474" height="312" rx="11" fill="#ffffff" stroke="#e3ebf4"/><rect x="34" y="96" width="474" height="52" rx="11" fill="#e8f0f9"/><rect x="34" y="136" width="474" height="12" fill="#e8f0f9"/><text x="54" y="129" font-size="17" font-weight="700" fill="#3f6ca3">Direct billing (not offered here)</text><circle cx="60" cy="176" r="4" fill="#5b8bc4"/><text font-size="14.5" fill="#4a5768"><tspan x="76" y="181">The clinic submits the claim to your insurer for you</tspan></text><line x1="54" y1="212" x2="488" y2="212" stroke="#e3ebf4"/><circle cx="60" cy="232" r="4" fill="#5b8bc4"/><text font-size="14.5" fill="#4a5768"><tspan x="76" y="237">You pay only the portion the plan does not cover</tspan></text><line x1="54" y1="268" x2="488" y2="268" stroke="#e3ebf4"/><circle cx="60" cy="288" r="4" fill="#5b8bc4"/><text font-size="14.5" fill="#4a5768"><tspan x="76" y="293">Requires the practice to be enrolled with that</tspan><tspan x="76" y="312.14">specific insurer</tspan></text><rect x="532" y="96" width="474" height="312" rx="11" fill="#ffffff" stroke="#e3ebf4"/><rect x="532" y="96" width="474" height="52" rx="11" fill="#f2f6fb"/><rect x="532" y="136" width="474" height="12" fill="#f2f6fb"/><text x="552" y="129" font-size="17" font-weight="700" fill="#3f6ca3">Pay and submit (how this practice works)</text><circle cx="558" cy="176" r="4" fill="#5b8bc4"/><text font-size="14.5" fill="#4a5768"><tspan x="574" y="181">You pay the full session fee at the time of the</tspan><tspan x="574" y="200.14">session</tspan></text><line x1="552" y1="212" x2="986" y2="212" stroke="#e3ebf4"/><circle cx="558" cy="232" r="4" fill="#5b8bc4"/><text font-size="14.5" fill="#4a5768"><tspan x="574" y="237">You receive a receipt showing the RCC registration</tspan><tspan x="574" y="256.14">number</tspan></text><line x1="552" y1="268" x2="986" y2="268" stroke="#e3ebf4"/><circle cx="558" cy="288" r="4" fill="#5b8bc4"/><text font-size="14.5" fill="#4a5768"><tspan x="574" y="293">You submit that receipt to your insurer and they</tspan><tspan x="574" y="312.14">reimburse you directly</tspan></text><line x1="552" y1="324" x2="986" y2="324" stroke="#e3ebf4"/><circle cx="558" cy="344" r="4" fill="#5b8bc4"/><text font-size="14.5" fill="#4a5768"><tspan x="574" y="349">Check your plan first: many cover a Registered</tspan><tspan x="574" y="368.14">Clinical Counsellor, some cover only a psychologist</tspan></text><text font-size="13" fill="#7d8896"><tspan x="34" y="426">Coverage varies by plan. Ask your provider whether services from a Registered Clinical Counsellor (RCC) are eligible before you book.</tspan></text>
</svg>
