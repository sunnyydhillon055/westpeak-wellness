<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 344" width="1040" height="344" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="t">How booking, payment and receipts fit together</title><desc id="d">A four-step diagram: booking a time in the calendar, paying by credit card at the moment of booking, attending the fifty-minute session by secure video, and receiving an itemised receipt by email to submit to an extended health plan.</desc><rect width="1040" height="344" rx="14" fill="#f7f2e8"/><text x="34" y="46" font-size="21" font-weight="700" fill="#2b3138">Paid before the session, receipted straight after</text><line x1="34" y1="66" x2="1006" y2="66" stroke="#e6ddce" stroke-width="1"/><rect x="34" y="96" width="228" height="207.5" rx="11" fill="#fffdf9" stroke="#e6ddce"/><circle cx="58" cy="122" r="13" fill="#e2edf4"/><text x="58" y="127" font-size="13" font-weight="700" fill="#3d6c92" text-anchor="middle">1</text><text x="80" y="127" font-size="15" font-weight="700" fill="#2b3138">Choose a time</text><text font-size="14" fill="#545e69"><tspan x="54" y="156.00">Live availability in the</tspan><tspan x="54" y="174.48">booking calendar. Pick a</tspan><tspan x="54" y="192.96">slot that works — no</tspan><tspan x="54" y="211.44">back-and-forth by email.</tspan></text><path d="M267 193.75 L276 199.75 L267 205.75" fill="none" stroke="#7ba7cb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="282" y="96" width="228" height="207.5" rx="11" fill="#fffdf9" stroke="#e6ddce"/><circle cx="306" cy="122" r="13" fill="#e2edf4"/><text x="306" y="127" font-size="13" font-weight="700" fill="#3d6c92" text-anchor="middle">2</text><text x="328" y="127" font-size="15" font-weight="700" fill="#2b3138">Pay by card</text><text font-size="14" fill="#545e69"><tspan x="302" y="156.00">Your card is taken as you</tspan><tspan x="302" y="174.48">book. Paying is what holds</tspan><tspan x="302" y="192.96">the slot, and it is handled</tspan><tspan x="302" y="211.44">by the payment processor.</tspan></text><path d="M515 193.75 L524 199.75 L515 205.75" fill="none" stroke="#7ba7cb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="530" y="96" width="228" height="207.5" rx="11" fill="#fffdf9" stroke="#e6ddce"/><circle cx="554" cy="122" r="13" fill="#e2edf4"/><text x="554" y="127" font-size="13" font-weight="700" fill="#3d6c92" text-anchor="middle">3</text><text x="576" y="127" font-size="15" font-weight="700" fill="#2b3138">The session</text><text font-size="14" fill="#545e69"><tspan x="550" y="156.00">50 minutes by secure</tspan><tspan x="550" y="174.48">video, anywhere in BC.</tspan><tspan x="550" y="192.96">Nothing to settle at the</tspan><tspan x="550" y="211.44">end — it is already paid.</tspan></text><path d="M763 193.75 L772 199.75 L763 205.75" fill="none" stroke="#7ba7cb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="778" y="96" width="228" height="207.5" rx="11" fill="#fffdf9" stroke="#e6ddce"/><circle cx="802" cy="122" r="13" fill="#e2edf4"/><text x="802" y="127" font-size="13" font-weight="700" fill="#3d6c92" text-anchor="middle">4</text><text x="824" y="127" font-size="15" font-weight="700" fill="#2b3138">Your receipt</text><text font-size="14" fill="#545e69"><tspan x="798" y="156.00">Emailed to you with the</tspan><tspan x="798" y="174.48">registration number that</tspan><tspan x="798" y="192.96">insurers ask for. Submit</tspan><tspan x="798" y="211.44">it to your plan yourself.</tspan></text></svg>