<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 474" width="1040" height="474" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">Burnout compared with depression</title><desc id="d">Two overlapping circles. Burnout is tied to a specific context and often lifts on extended leave; depression is present across contexts. Shared features include exhaustion, poor sleep, difficulty concentrating and withdrawal.</desc>
<rect width="1040" height="474" rx="14" fill="#f5f9fd"/>
<text x="34" y="46" font-size="21" font-weight="700" fill="#1f2a37">Burnout and depression overlap — the difference is where it follows you</text><line x1="34" y1="66" x2="1006" y2="66" stroke="#e3ebf4"/><circle cx="400" cy="258" r="132" fill="#e8f0f9" fill-opacity="0.85" stroke="#5b8bc4" stroke-width="1.6"/><circle cx="640" cy="258" r="132" fill="#dce9f7" fill-opacity="0.7" stroke="#3f6ca3" stroke-width="1.6"/><text x="338" y="112" font-size="16.5" font-weight="700" fill="#3f6ca3" text-anchor="middle">Burnout</text><text x="702" y="112" font-size="16.5" font-weight="700" fill="#3f6ca3" text-anchor="middle">Depression</text><text x="520" y="196" font-size="12.5" font-weight="700" fill="#3f6ca3" text-anchor="middle" letter-spacing="1.4">SHARED</text><text x="334" y="228" font-size="14" fill="#1f2a37" text-anchor="middle">Tied to one context</text><text x="334" y="254" font-size="14" fill="#1f2a37" text-anchor="middle">Cynicism about the work</text><text x="334" y="280" font-size="14" fill="#1f2a37" text-anchor="middle">Often eases on</text><text x="334" y="306" font-size="14" fill="#1f2a37" text-anchor="middle">genuine extended leave</text><text x="520" y="226" font-size="13.5" fill="#4a5768" text-anchor="middle">Exhaustion</text><text x="520" y="252" font-size="13.5" fill="#4a5768" text-anchor="middle">Broken sleep</text><text x="520" y="278" font-size="13.5" fill="#4a5768" text-anchor="middle">Poor concentration</text><text x="520" y="304" font-size="13.5" fill="#4a5768" text-anchor="middle">Pulling away from people</text><text x="520" y="330" font-size="13.5" fill="#4a5768" text-anchor="middle">Irritability</text><text x="706" y="228" font-size="14" fill="#1f2a37" text-anchor="middle">Present across contexts</text><text x="706" y="254" font-size="14" fill="#1f2a37" text-anchor="middle">Loss of pleasure in</text><text x="706" y="280" font-size="14" fill="#1f2a37" text-anchor="middle">things unrelated to work</text><text x="706" y="306" font-size="14" fill="#1f2a37" text-anchor="middle">Guilt and worthlessness</text><text font-size="13" fill="#7d8896"><tspan x="34" y="434">This is an orientation aid, not a diagnostic tool. Burnout is an occupational phenomenon in the ICD-11, not a medical condition; only a</tspan><tspan x="34" y="451">qualified professional can assess depression.</tspan></text>
</svg>
