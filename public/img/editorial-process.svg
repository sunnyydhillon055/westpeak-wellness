<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 344" width="1040" height="344" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">How a page on this site is written and reviewed</title><desc id="d">A four-step diagram of the editorial process: drafting from primary sources, clinical review by a Registered Clinical Counsellor, checking each claim against its source, and dating the page for later review.</desc>
<rect width="1040" height="344" rx="14" fill="#f7f2e8"/>
<text x="34" y="46" font-size="21" font-weight="700" fill="#2b3138">How anything on this site gets published</text><line x1="34" y1="66" x2="1006" y2="66" stroke="#e6ddce" stroke-width="1"/><rect x="34" y="96" width="228" height="207.5" rx="11" fill="#fffdf9" stroke="#e6ddce"/><circle cx="58" cy="122" r="13" fill="#e2edf4"/><text x="58" y="127" font-size="13" font-weight="700" fill="#3d6c92" text-anchor="middle">1</text><text x="80" y="127" font-size="15" font-weight="700" fill="#2b3138">Sourced first</text><text font-size="14" fill="#545e69"><tspan x="54" y="156">Systematic reviews before</tspan><tspan x="54" y="174.48">single trials; the body</tspan><tspan x="54" y="192.96">that sets a rule rather</tspan><tspan x="54" y="211.44">than an article</tspan><tspan x="54" y="229.92000000000002">summarising it. Never</tspan><tspan x="54" y="248.4">this site citing itself</tspan><tspan x="54" y="266.88">as evidence.</tspan></text><path d="M267 193.75 L276 199.75 L267 205.75" fill="none" stroke="#7ba7cb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="282" y="96" width="228" height="207.5" rx="11" fill="#fffdf9" stroke="#e6ddce"/><circle cx="306" cy="122" r="13" fill="#e2edf4"/><text x="306" y="127" font-size="13" font-weight="700" fill="#3d6c92" text-anchor="middle">2</text><text x="328" y="127" font-size="15" font-weight="700" fill="#2b3138">Clinically reviewed</text><text font-size="14" fill="#545e69"><tspan x="302" y="156">Written and reviewed by a</tspan><tspan x="302" y="174.48">Registered Clinical</tspan><tspan x="302" y="192.96">Counsellor in independent</tspan><tspan x="302" y="211.44">practice. Nothing</tspan><tspan x="302" y="229.92000000000002">clinical is published</tspan><tspan x="302" y="248.4">without that review.</tspan></text><path d="M515 193.75 L524 199.75 L515 205.75" fill="none" stroke="#7ba7cb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="530" y="96" width="228" height="207.5" rx="11" fill="#fffdf9" stroke="#e6ddce"/><circle cx="554" cy="122" r="13" fill="#e2edf4"/><text x="554" y="127" font-size="13" font-weight="700" fill="#3d6c92" text-anchor="middle">3</text><text x="576" y="127" font-size="15" font-weight="700" fill="#2b3138">Claims checked</text><text font-size="14" fill="#545e69"><tspan x="550" y="156">Every factual claim is</tspan><tspan x="550" y="174.48">checked against the</tspan><tspan x="550" y="192.96">source it links, and</tspan><tspan x="550" y="211.44">worded to keep averages</tspan><tspan x="550" y="229.92000000000002">across groups distinct</tspan><tspan x="550" y="248.4">from what will happen to</tspan><tspan x="550" y="266.88">you.</tspan></text><path d="M763 193.75 L772 199.75 L763 205.75" fill="none" stroke="#7ba7cb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="778" y="96" width="228" height="207.5" rx="11" fill="#fffdf9" stroke="#e6ddce"/><circle cx="802" cy="122" r="13" fill="#e2edf4"/><text x="802" y="127" font-size="13" font-weight="700" fill="#3d6c92" text-anchor="middle">4</text><text x="824" y="127" font-size="15" font-weight="700" fill="#2b3138">Dated and revisited</text><text font-size="14" fill="#545e69"><tspan x="798" y="156">Coverage rules and</tspan><tspan x="798" y="174.48">guidance change. Every</tspan><tspan x="798" y="192.96">page carries the date it</tspan><tspan x="798" y="211.44">was last reviewed, so you</tspan><tspan x="798" y="229.92000000000002">can weigh how stale it</tspan><tspan x="798" y="248.4">might be.</tspan></text>
</svg>
