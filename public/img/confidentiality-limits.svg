<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 451" width="1040" height="451" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">The limits of confidentiality in counselling</title><desc id="d">A two-column comparison of what stays confidential in counselling against the four legally defined exceptions where a counsellor must act.</desc>
<rect width="1040" height="451" rx="14" fill="#f5f9fd"/>
<text x="34" y="46" font-size="21" font-weight="700" fill="#1f2a37">What stays in the room, and the four things that do not</text><line x1="34" y1="66" x2="1006" y2="66" stroke="#e3ebf4"/><rect x="34" y="96" width="474" height="312" rx="11" fill="#ffffff" stroke="#e3ebf4"/><rect x="34" y="96" width="474" height="52" rx="11" fill="#e8f0f9"/><rect x="34" y="136" width="474" height="12" fill="#e8f0f9"/><text x="54" y="129" font-size="17" font-weight="700" fill="#3f6ca3">Stays in the room</text><circle cx="60" cy="176" r="4" fill="#5b8bc4"/><text font-size="14.5" fill="#4a5768"><tspan x="76" y="181">What you say, and what you decline to say</tspan></text><line x1="54" y1="212" x2="488" y2="212" stroke="#e3ebf4"/><circle cx="60" cy="232" r="4" fill="#5b8bc4"/><text font-size="14.5" fill="#4a5768"><tspan x="76" y="237">Your history, your diagnosis-free record, your reasons</tspan></text><line x1="54" y1="268" x2="488" y2="268" stroke="#e3ebf4"/><circle cx="60" cy="288" r="4" fill="#5b8bc4"/><text font-size="14.5" fill="#4a5768"><tspan x="76" y="293">Not shared with family, employer, doctor or insurer</tspan><tspan x="76" y="312.14">without your written consent</tspan></text><line x1="54" y1="324" x2="488" y2="324" stroke="#e3ebf4"/><circle cx="60" cy="344" r="4" fill="#5b8bc4"/><text font-size="14.5" fill="#4a5768"><tspan x="76" y="349">A benefits claim proves a session happened — not what</tspan><tspan x="76" y="368.14">was in it</tspan></text><rect x="532" y="96" width="474" height="312" rx="11" fill="#ffffff" stroke="#e3ebf4"/><rect x="532" y="96" width="474" height="52" rx="11" fill="#f2f6fb"/><rect x="532" y="136" width="474" height="12" fill="#f2f6fb"/><text x="552" y="129" font-size="17" font-weight="700" fill="#3f6ca3">The legal exceptions</text><circle cx="558" cy="176" r="4" fill="#5b8bc4"/><text font-size="14.5" fill="#4a5768"><tspan x="574" y="181">Real and imminent risk of serious harm to you or an</tspan><tspan x="574" y="200.14">identifiable person</tspan></text><line x1="552" y1="212" x2="986" y2="212" stroke="#e3ebf4"/><circle cx="558" cy="232" r="4" fill="#5b8bc4"/><text font-size="14.5" fill="#4a5768"><tspan x="574" y="237">Suspected abuse or neglect of someone under nineteen</tspan></text><line x1="552" y1="268" x2="986" y2="268" stroke="#e3ebf4"/><circle cx="558" cy="288" r="4" fill="#5b8bc4"/><text font-size="14.5" fill="#4a5768"><tspan x="574" y="293">A valid court order or subpoena</tspan></text><line x1="552" y1="324" x2="986" y2="324" stroke="#e3ebf4"/><circle cx="558" cy="344" r="4" fill="#5b8bc4"/><text font-size="14.5" fill="#4a5768"><tspan x="574" y="349">Clinical consultation, with identifying details</tspan><tspan x="574" y="368.14">removed</tspan></text><text font-size="13" fill="#7d8896"><tspan x="34" y="426">These are named in writing before the first session, not discovered afterwards.</tspan></text>
</svg>
