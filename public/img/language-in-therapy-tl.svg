<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 474" width="1040" height="474" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">Ang hawak ng bawat wika sa therapy</title><desc id="d">Tatlong hanay para sa isang bilingguwal na kliyente. Ang unang wika ang madalas humahawak ng alaala ng pagkabata, ugnayan sa pamilya at damdamin. Ang Ingles ay nagbibigay ng distansiya at ng bokabularyo ng trabaho. Sa gitna, isang sesyon na kayang lumipat sa pagitan ng dalawa kahit hati ang pangungusap.</desc>
<rect width="1040" height="474" rx="14" fill="#f7f2e8"/>
<text x="34" y="46" font-size="21" font-weight="700" fill="#2b3138">Dalawang wika, at hindi pareho ang hawak nila</text><line x1="34" y1="66" x2="1006" y2="66" stroke="#e6ddce"/>

<!-- Drawn as three columns rather than as a Venn. The first version overlapped
     two circles, which gave the shared middle a 24px window to hold 180px of
     text: every line in it crossed both strokes. The content is not really an
     intersection anyway - the middle column is a fact about the counsellor,
     not about the languages - so the shape now says what the words say. -->
<circle cx="310" cy="262" r="128" fill="#e2edf4" fill-opacity="0.85" stroke="#7ba7cb" stroke-width="1.6"/>
<circle cx="730" cy="262" r="128" fill="#dbe9f2" fill-opacity="0.7" stroke="#3d6c92" stroke-width="1.6"/>
<rect x="442" y="168" width="156" height="188" rx="14" fill="#fffdf9" stroke="#e6ddce" stroke-width="1.4"/>

<text x="310" y="100" font-size="16.5" font-weight="700" fill="#3d6c92" text-anchor="middle">Tagalog</text><text x="310" y="120" font-size="13" fill="#5f6872" text-anchor="middle">ang unang wika</text>
<text x="730" y="100" font-size="16.5" font-weight="700" fill="#3d6c92" text-anchor="middle">Ingles</text><text x="730" y="120" font-size="13" fill="#5f6872" text-anchor="middle">ang pangalawang wika</text>

<text x="310" y="222" font-size="14" fill="#2b3138" text-anchor="middle">Alaala ng pagkabata</text><text x="310" y="248" font-size="14" fill="#2b3138" text-anchor="middle">Ugnayan sa pamilya</text><text x="310" y="274" font-size="14" fill="#2b3138" text-anchor="middle">Damdamin, gaya ng nangyari</text><text x="310" y="300" font-size="14" fill="#2b3138" text-anchor="middle">Mga salitang walang</text><text x="310" y="322" font-size="14" fill="#2b3138" text-anchor="middle">katumbas sa Ingles</text>

<text x="520" y="200" font-size="11.5" font-weight="700" fill="#3d6c92" text-anchor="middle" letter-spacing="1.2">ALINMAN</text><text x="520" y="216" font-size="11.5" font-weight="700" fill="#3d6c92" text-anchor="middle" letter-spacing="1.2">GITNA NG SESYON</text>
<text x="520" y="252" font-size="13" fill="#545e69" text-anchor="middle">Marunong ng dalawa</text><text x="520" y="272" font-size="13" fill="#545e69" text-anchor="middle">ang counsellor, kaya</text><text x="520" y="298" font-size="13" fill="#545e69" text-anchor="middle">hindi kailangang</text><text x="520" y="318" font-size="13" fill="#545e69" text-anchor="middle">ipaliwanag ang paglipat</text>

<text x="730" y="222" font-size="14" fill="#2b3138" text-anchor="middle">Distansiya mula sa</text><text x="730" y="248" font-size="14" fill="#2b3138" text-anchor="middle">parehong paksa</text><text x="730" y="274" font-size="14" fill="#2b3138" text-anchor="middle">Pagsusuri at pagpapangalan</text><text x="730" y="300" font-size="14" fill="#2b3138" text-anchor="middle">Trabaho, diagnosis,</text><text x="730" y="322" font-size="14" fill="#2b3138" text-anchor="middle">ang klinikal na bokabularyo</text>

<text font-size="13" fill="#5f6872"><tspan x="34" y="434">Walang wikang tama sa pangkalahatan, at hindi ito panuntunan kung alin ang pipiliin. Paglalarawan ito ng pattern na</tspan><tspan x="34" y="451">ang madalas iulat — kaya hindi kailangang magpasya nang maaga.</tspan></text>
</svg>
