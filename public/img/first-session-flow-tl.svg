<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 344" width="1040" height="344" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">Ang daloy mula sa unang ugnayan hanggang sa unang sesyon</title><desc id="d">Apat na hakbang: libreng labinlimang minutong konsultasyon, intake at pahintulot, ang unang buong sesyon, at ang pagpapasya kung ano ang susunod. Normal na resulta ang hindi magpatuloy.</desc>
<rect width="1040" height="344" rx="14" fill="#f7f2e8"/>
<text x="34" y="46" font-size="21" font-weight="700" fill="#2b3138">Ang tunay na nangyayari, mula sa unang ugnayan hanggang sa unang sesyon</text><line x1="34" y1="66" x2="1006" y2="66" stroke="#e6ddce" stroke-width="1"/><rect x="34" y="96" width="228" height="207.5" rx="11" fill="#fffdf9" stroke="#e6ddce"/><circle cx="58" cy="122" r="13" fill="#e2edf4"/><text x="58" y="127" font-size="13" font-weight="700" fill="#3d6c92" text-anchor="middle">1</text><text x="80" y="127" font-size="15" font-weight="700" fill="#2b3138">Libreng konsultasyon</text><text font-size="14" fill="#545e69"><tspan x="54" y="156">Labinlimang minuto sa ligtas na</tspan><tspan x="54" y="174.48">video. Ilalarawan mo ang</tspan><tspan x="54" y="192.96">nangyayari; maririnig mo kung</tspan><tspan x="54" y="211.44">paano gagana. Walang</tspan><tspan x="54" y="229.92000000000002">obligasyon sa magkabilang panig.</tspan></text><path d="M267 193.75 L276 199.75 L267 205.75" fill="none" stroke="#7ba7cb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="282" y="96" width="228" height="207.5" rx="11" fill="#fffdf9" stroke="#e6ddce"/><circle cx="306" cy="122" r="13" fill="#e2edf4"/><text x="306" y="127" font-size="13" font-weight="700" fill="#3d6c92" text-anchor="middle">2</text><text x="328" y="127" font-size="15" font-weight="700" fill="#2b3138">Intake at pahintulot</text><text font-size="14" fill="#545e69"><tspan x="302" y="156">Maikling form bago ang</tspan><tspan x="302" y="174.48">sesyon: kasaysayan,</tspan><tspan x="302" y="192.96">gamot, kaligtasan at ang</tspan><tspan x="302" y="211.44">mga hangganan ng</tspan><tspan x="302" y="229.92000000000002">pagiging kumpidensiyal — kaya</tspan><tspan x="302" y="248.4">hindi papeles ang</tspan><tspan x="302" y="266.88">unang sesyon.</tspan></text><path d="M515 193.75 L524 199.75 L515 205.75" fill="none" stroke="#7ba7cb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="530" y="96" width="228" height="207.5" rx="11" fill="#fffdf9" stroke="#e6ddce"/><circle cx="554" cy="122" r="13" fill="#e2edf4"/><text x="554" y="127" font-size="13" font-weight="700" fill="#3d6c92" text-anchor="middle">3</text><text x="576" y="127" font-size="15" font-weight="700" fill="#2b3138">Ang unang sesyon</text><text font-size="14" fill="#545e69"><tspan x="550" y="156">Limampung minuto. Kadalasan ang</tspan><tspan x="550" y="174.48">kuwento, sa sarili mong sunod,</tspan><tspan x="550" y="192.96">at kung ano ang gusto mong</tspan><tspan x="550" y="211.44">magbago. Ikaw ang magtatakda</tspan><tspan x="550" y="229.92000000000002">ng bilis sa mabibigat na bahagi.</tspan></text><path d="M763 193.75 L772 199.75 L763 205.75" fill="none" stroke="#7ba7cb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="778" y="96" width="228" height="207.5" rx="11" fill="#fffdf9" stroke="#e6ddce"/><circle cx="802" cy="122" r="13" fill="#e2edf4"/><text x="802" y="127" font-size="13" font-weight="700" fill="#3d6c92" text-anchor="middle">4</text><text x="824" y="127" font-size="15" font-weight="700" fill="#2b3138">Pagpapasya sa susunod</text><text font-size="14" fill="#545e69"><tspan x="798" y="156">Ang huling sampung minuto ay</tspan><tspan x="798" y="174.48">praktikal: kung magpapatuloy,</tspan><tspan x="798" y="192.96">gaano kadalas, at kung ano</tspan><tspan x="798" y="211.44">ang unang pagtutuunan.</tspan><tspan x="798" y="229.92000000000002">Normal na resulta ang</tspan><tspan x="798" y="248.4">hindi magpatuloy.</tspan></text>
</svg>
