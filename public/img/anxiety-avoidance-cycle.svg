<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 653" width="1040" height="653" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">The anxiety avoidance cycle</title><desc id="d">A four-node loop: a trigger produces anxiety, avoidance brings immediate relief, that relief teaches the brain the threat was real, and the situation becomes more frightening next time, feeding back into the trigger.</desc>
<rect width="1040" height="653" rx="14" fill="#f5f9fd"/>
<text x="34" y="46" font-size="21" font-weight="700" fill="#1f2a37">Why avoiding the thing makes the thing bigger</text><line x1="34" y1="66" x2="1006" y2="66" stroke="#e3ebf4"/><circle cx="520" cy="340" r="215" fill="none" stroke="#e3ebf4" stroke-width="2" stroke-dasharray="5 7"/><circle cx="520" cy="340" r="66" fill="#e8f0f9"/><text font-size="14.5" font-weight="700" fill="#3f6ca3" text-anchor="middle"><tspan x="520" y="326">The loop that</tspan><tspan x="520" y="345">keeps anxiety</tspan><tspan x="520" y="364">in business</tspan></text><path d="M-6 -5 L5 0 L-6 5" fill="none" stroke="#5b8bc4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" transform="translate(672.0 188.0) rotate(45)"/><path d="M-6 -5 L5 0 L-6 5" fill="none" stroke="#5b8bc4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" transform="translate(672.0 492.0) rotate(135)"/><path d="M-6 -5 L5 0 L-6 5" fill="none" stroke="#5b8bc4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" transform="translate(368.0 492.0) rotate(225)"/><path d="M-6 -5 L5 0 L-6 5" fill="none" stroke="#5b8bc4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" transform="translate(368.0 188.0) rotate(315)"/><rect x="404" y="82" width="232" height="86" rx="10" fill="#ffffff" stroke="#e3ebf4"/><text x="520" y="107" font-size="15" font-weight="700" fill="#1f2a37" text-anchor="middle">Trigger</text><text font-size="13" fill="#4a5768" text-anchor="middle"><tspan x="520" y="126">A situation, thought or</tspan><tspan x="520" y="142">sensation that reads as</tspan><tspan x="520" y="158">dangerous.</tspan></text><rect x="619" y="297" width="232" height="86" rx="10" fill="#ffffff" stroke="#e3ebf4"/><text x="735" y="322" font-size="15" font-weight="700" fill="#1f2a37" text-anchor="middle">Anxiety climbs</text><text font-size="13" fill="#4a5768" text-anchor="middle"><tspan x="735" y="341">Body escalates. The urge to</tspan><tspan x="735" y="357">leave becomes overwhelming.</tspan></text><rect x="404" y="512" width="232" height="86" rx="10" fill="#ffffff" stroke="#e3ebf4"/><text x="520" y="537" font-size="15" font-weight="700" fill="#1f2a37" text-anchor="middle">Avoid or escape</text><text font-size="13" fill="#4a5768" text-anchor="middle"><tspan x="520" y="556">Relief arrives fast. This is</tspan><tspan x="520" y="572">the part that feels like it</tspan><tspan x="520" y="588">worked.</tspan></text><rect x="189" y="297" width="232" height="86" rx="10" fill="#ffffff" stroke="#e3ebf4"/><text x="305" y="322" font-size="15" font-weight="700" fill="#1f2a37" text-anchor="middle">Threat confirmed</text><text font-size="13" fill="#4a5768" text-anchor="middle"><tspan x="305" y="341">The brain concludes escape was</tspan><tspan x="305" y="357">necessary. Next time is worse.</tspan></text><text font-size="13" fill="#7d8896"><tspan x="34" y="632">Counselling for anxiety works on the third box — building tolerance for the discomfort rather than eliminating the trigger.</tspan></text>
</svg>
