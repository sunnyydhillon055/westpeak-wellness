<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" width="1040" height="430" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">Virtual counselling reach across British Columbia</title><desc id="d">A stylised map of British Columbia with a central video-session hub linked by dotted lines to Prince George, Kamloops, Kelowna, Abbotsford, Surrey, Vancouver, Nanaimo and Victoria, showing that sessions reach every region of the province.</desc>
<rect width="1040" height="430" rx="14" fill="#f7f2e8"/>
