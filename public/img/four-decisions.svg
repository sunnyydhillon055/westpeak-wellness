<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 325" width="1040" height="325" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">The four decisions people make when choosing counselling</title><desc id="d">A four-step diagram of the decisions made when choosing counselling: which designation, which method, how it is paid for, and how often sessions happen.</desc>
<rect width="1040" height="325" rx="14" fill="#f5f9fd"/>
<text x="34" y="46" font-size="21" font-weight="700" fill="#1f2a37">Four decisions, usually made all at once</text><line x1="34" y1="66" x2="1006" y2="66" stroke="#e3ebf4" stroke-width="1"/><rect x="34" y="96" width="228" height="189" rx="11" fill="#ffffff" stroke="#e3ebf4"/><circle cx="58" cy="122" r="13" fill="#e8f0f9"/><text x="58" y="127" font-size="13" font-weight="700" fill="#3f6ca3" text-anchor="middle">1</text><text x="80" y="127" font-size="15" font-weight="700" fill="#1f2a37">Who</text><text font-size="14" fill="#4a5768"><tspan x="54" y="156">Which designation — RCC,</tspan><tspan x="54" y="174.48">psychologist, social</tspan><tspan x="54" y="192.96">worker. This is what</tspan><tspan x="54" y="211.44">determines whether there</tspan><tspan x="54" y="229.92000000000002">is a complaints process</tspan><tspan x="54" y="248.4">behind the person.</tspan></text><path d="M267 184.5 L276 190.5 L267 196.5" fill="none" stroke="#5b8bc4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="282" y="96" width="228" height="189" rx="11" fill="#ffffff" stroke="#e3ebf4"/><circle cx="306" cy="122" r="13" fill="#e8f0f9"/><text x="306" y="127" font-size="13" font-weight="700" fill="#3f6ca3" text-anchor="middle">2</text><text x="328" y="127" font-size="15" font-weight="700" fill="#1f2a37">What</text><text font-size="14" fill="#4a5768"><tspan x="302" y="156">Which method. Matters</tspan><tspan x="302" y="174.48">more for trauma than for</tspan><tspan x="302" y="192.96">most things, and a good</tspan><tspan x="302" y="211.44">counsellor can explain</tspan><tspan x="302" y="229.92000000000002">their choice.</tspan></text><path d="M515 184.5 L524 190.5 L515 196.5" fill="none" stroke="#5b8bc4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="530" y="96" width="228" height="189" rx="11" fill="#ffffff" stroke="#e3ebf4"/><circle cx="554" cy="122" r="13" fill="#e8f0f9"/><text x="554" y="127" font-size="13" font-weight="700" fill="#3f6ca3" text-anchor="middle">3</text><text x="576" y="127" font-size="15" font-weight="700" fill="#1f2a37">How much</text><text font-size="14" fill="#4a5768"><tspan x="550" y="156">What it costs, what a</tspan><tspan x="550" y="174.48">plan reimburses, and</tspan><tspan x="550" y="192.96">which free routes you may</tspan><tspan x="550" y="211.44">already be entitled to</tspan><tspan x="550" y="229.92000000000002">and have never used.</tspan></text><path d="M763 184.5 L772 190.5 L763 196.5" fill="none" stroke="#5b8bc4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="778" y="96" width="228" height="189" rx="11" fill="#ffffff" stroke="#e3ebf4"/><circle cx="802" cy="122" r="13" fill="#e8f0f9"/><text x="802" y="127" font-size="13" font-weight="700" fill="#3f6ca3" text-anchor="middle">4</text><text x="824" y="127" font-size="15" font-weight="700" fill="#1f2a37">How often</text><text font-size="14" fill="#4a5768"><tspan x="798" y="156">Treated as scheduling and</tspan><tspan x="798" y="174.48">actually clinical. Weekly</tspan><tspan x="798" y="192.96">builds momentum;</tspan><tspan x="798" y="211.44">fortnightly suits</tspan><tspan x="798" y="229.92000000000002">consolidation.</tspan></text>
</svg>
