<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">Virtual counselling reach across Alberta</title><desc id="d">A stylised map of Alberta with a central video-session hub linked by dotted lines to Fort McMurray, Grande Prairie, Edmonton, Red Deer, Calgary, Medicine Hat and Lethbridge, showing that sessions reach every region of the province.</desc>
<rect width="1040" height="560" rx="14" fill="#f7f2e8"/>
