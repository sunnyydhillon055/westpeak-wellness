" y="271.9" font-size="12" fill="#5f6872" text-anchor="end">Northwest Alberta</text><circle cx="551.5" cy="312.8" r="6.5" fill="#3d6c92"/><circle cx="551.5" cy="312.8" r="12" fill="none" stroke="#7ba7cb" stroke-opacity="0.45"/><text x="571.5" y="311.8" font-size="14" font-weight="700" fill="#2b3138" text-anchor="start">Edmonton</text><text x="571.5" y="327.8" font-size="12" fill="#5f6872" text-anchor="start">Capital Region</text><circle cx="544.9" cy="357" r="6.5" fill="#3d6c92"/><circle cx="544.9" cy="357" r="12" fill="none" stroke="#7ba7cb" stroke-opacity="0.45"/><text x="524.9" y="356" font-size="14" font-weight="700" fill="#2b3138" text-anchor="end">Red Deer</text><text x="524.9" y="372" font-size="12" fill="#5f6872" text-anchor="end">Central Alberta</text><circle cx="539.6" cy="399.5" r="6.5" fill="#3d6c92"/><circle cx="539.6" cy="399.5" r="12" fill="none" stroke="#7ba7cb" stroke-opacity="0.45"/><text x="519.6" y="398.5" font-size="14" font-weight="700" fill="#2b3138" text-anchor="end">Calgary</text><text x="519.6" y="414.5" font-size="12" fill="#5f6872" text-anchor="end">Calgary Region</text><circle cx="609.1" cy="434.1" r="6.5" fill="#3d6c92"/><circle cx="609.1" cy="434.1" r="12" fill="none" stroke="#7ba7cb" stroke-opacity="0.45"/><text x="629.1" y="433.1" font-size="14" font-weight="700" fill="#2b3138" text-anchor="start">Medicine Hat</text><text x="629.1" y="449.1" font-size="12" fill="#5f6872" text-anchor="start">Southeast Alberta</text><circle cx="564.8" cy="446.2" r="6.5" fill="#3d6c92"/><circle cx="564.8" cy="446.2" r="12" fill="none" stroke="#7ba7cb" stroke-opacity="0.45"/><text x="544.8" y="445.2" font-size="14" font-weight="700" fill="#2b3138" text-anchor="end">Lethbridge</text><text x="544.8" y="461.2" font-size="12" fill="#5f6872" text-anchor="end">Southern Alberta</text><text font-size="13" fill="#5f6872"><tspan x="34" y="522">Sessions run by secure video on Mountain Time, so distance inside Alberta stops being a factor — including communities where the local</tspan><tspan x="34" y="539">counsellor list is short or closed.</tspan></text>
