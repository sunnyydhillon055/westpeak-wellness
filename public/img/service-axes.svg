<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 451" width="1040" height="451" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">How counselling services are organised</title><desc id="d">A two-column diagram contrasting how services are grouped by the problem a person brings against how they are grouped by the method used, showing that the two are different ways into the same work.</desc>
<rect width="1040" height="451" rx="14" fill="#f7f2e8"/>
<text x="34" y="46" font-size="21" font-weight="700" fill="#2b3138">Two ways into the same work</text><line x1="34" y1="66" x2="1006" y2="66" stroke="#e6ddce"/><rect x="34" y="96" width="474" height="312" rx="11" fill="#fffdf9" stroke="#e6ddce"/><rect x="34" y="96" width="474" height="52" rx="11" fill="#e2edf4"/><rect x="34" y="136" width="474" height="12" fill="#e2edf4"/><text x="54" y="129" font-size="17" font-weight="700" fill="#3d6c92">By what you bring</text><circle cx="60" cy="176" r="4" fill="#7ba7cb"/><text font-size="14.5" fill="#545e69"><tspan x="76" y="181">Anxiety, depression, trauma, a relationship — the</tspan><tspan x="76" y="200.14">service pages</tspan></text><line x1="54" y1="212" x2="488" y2="212" stroke="#e6ddce"/><circle cx="60" cy="232" r="4" fill="#7ba7cb"/><text font-size="14.5" fill="#545e69"><tspan x="76" y="237">You start from the difficulty you can already name</tspan></text><line x1="54" y1="268" x2="488" y2="268" stroke="#e6ddce"/><circle cx="60" cy="288" r="4" fill="#7ba7cb"/><text font-size="14.5" fill="#545e69"><tspan x="76" y="293">Best when you know what is wrong but not what to do</tspan></text><line x1="54" y1="324" x2="488" y2="324" stroke="#e6ddce"/><circle cx="60" cy="344" r="4" fill="#7ba7cb"/><text font-size="14.5" fill="#545e69"><tspan x="76" y="349">Nine services, all delivered by secure video across BC</tspan></text><rect x="532" y="96" width="474" height="312" rx="11" fill="#fffdf9" stroke="#e6ddce"/><rect x="532" y="96" width="474" height="52" rx="11" fill="#f7f2e8"/><rect x="532" y="136" width="474" height="12" fill="#f7f2e8"/><text x="552" y="129" font-size="17" font-weight="700" fill="#3d6c92">By how the work is done</text><circle cx="558" cy="176" r="4" fill="#7ba7cb"/><text font-size="14.5" fill="#545e69"><tspan x="574" y="181">CBT, EMDR, ACT, parts work, somatic, DBT skills — the</tspan><tspan x="574" y="200.14">approach pages</tspan></text><line x1="552" y1="212" x2="986" y2="212" stroke="#e6ddce"/><circle cx="558" cy="232" r="4" fill="#7ba7cb"/><text font-size="14.5" fill="#545e69"><tspan x="574" y="237">You start from a method you were recommended or have</tspan><tspan x="574" y="256.14">tried</tspan></text><line x1="552" y1="268" x2="986" y2="268" stroke="#e6ddce"/><circle cx="558" cy="288" r="4" fill="#7ba7cb"/><text font-size="14.5" fill="#545e69"><tspan x="574" y="293">Best when a previous approach did not suit you</tspan></text><line x1="552" y1="324" x2="986" y2="324" stroke="#e6ddce"/><circle cx="558" cy="344" r="4" fill="#7ba7cb"/><text font-size="14.5" fill="#545e69"><tspan x="574" y="349">Every approach page states where that method works</tspan><tspan x="574" y="368.14">poorly</tspan></text><text font-size="13" fill="#5f6872"><tspan x="34" y="426">Most people arrive on the left and never need the right. Both lead to the same consultation.</tspan></text>
</svg>
